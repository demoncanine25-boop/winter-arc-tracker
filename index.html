<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Winter Arc — Social Discipline Tracker</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            arc: {
              black: '#080c14',
              card: '#0f172a',
              border: '#1e293b',
              accent: '#38bdf8',
              glow: '#0284c7',
              neon: '#22d3ee'
            }
          }
        }
      }
    };
  </script>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase App & Database (Official CDN for Cross-Device Global Sync) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body {
      background-color: #080c14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .glow-box {
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen bg-arc-black text-slate-100 pb-12 selection:bg-sky-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- DEFAULT REALTIME CLOUD BACKEND FOR GLOBAL CROSS-DEVICE SYNC ---
    // Uses Firebase public RTDB namespace (No server required, 0 CORS blocks)
    const firebaseConfig = {
      databaseURL: "https://winter-arc-tracker-default-rtdb.firebaseio.com"
    };

    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    } catch (e) {
      console.warn("Firebase initialization fallback active:", e);
    }

    // Default 5 Core Discipline Rules
    const DEFAULT_HABITS = [
      { id: 'h1', text: '5:00 AM Wake Up', completed: false },
      { id: 'h2', text: '45 Min Workout / Gym', completed: false },
      { id: 'h3', text: 'Read 10 Pages of Non-Fiction', completed: false },
      { id: 'h4', text: '10,000 Daily Steps', completed: false },
      { id: 'h5', text: 'No Sugar / Zero Alcohol', completed: false }
    ];

    function App() {
      // Local User Profile State
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('wa_user');
        return saved ? JSON.parse(saved) : {
          id: 'usr_' + Math.random().toString(36).substring(2, 9),
          name: '',
          avatar: '⚡',
          wakeTime: '05:00',
          currentWeight: '',
          goalWeight: '',
          manifesto: ''
        };
      });

      // Active Room State
      const [room, setRoom] = useState(() => {
        const saved = localStorage.getItem('wa_room');
        return saved ? JSON.parse(saved) : { name: '', pass: '', joined: false };
      });

      // Room Form Inputs
      const [roomInputName, setRoomInputName] = useState('');
      const [roomInputPass, setRoomInputPass] = useState('');

      // Habits state for today
      const [habits, setHabits] = useState(() => {
        const saved = localStorage.getItem('wa_habits');
        return saved ? JSON.parse(saved) : DEFAULT_HABITS;
      });

      // Daily completion history map: { "YYYY-MM-DD": completionPercentage }
      const [history, setHistory] = useState(() => {
        const saved = localStorage.getItem('wa_history');
        return saved ? JSON.parse(saved) : {};
      });

      // Global Room State (Synced from Cloud)
      const [roomMembers, setRoomMembers] = useState([]);
      const [activityFeed, setActivityFeed] = useState([]);
      const [syncStatus, setSyncStatus] = useState('Disconnected');
      const [activeTab, setActiveTab] = useState('habits'); // 'habits', 'leaderboard', 'feed', 'profile'
      const [newHabitText, setNewHabitText] = useState('');
      const [newPostText, setNewPostText] = useState('');

      const todayKey = new Date().toISOString().split('T')[0];

      // Save user profile locally
      useEffect(() => {
        localStorage.setItem('wa_user', JSON.stringify(user));
      }, [user]);

      // Save habits locally
      useEffect(() => {
        localStorage.setItem('wa_habits', JSON.stringify(habits));
      }, [habits]);

      // Save history locally
      useEffect(() => {
        localStorage.setItem('wa_history', JSON.stringify(history));
      }, [history]);

      // Save room locally
      useEffect(() => {
        localStorage.setItem('wa_room', JSON.stringify(room));
      }, [room]);

      // Calculate streak and statistics
      const calculateStreak = () => {
        let streak = 0;
        let d = new Date();
        
        // If completed today, count today
        let dateStr = d.toISOString().split('T')[0];
        if (history[dateStr] === 100) {
          streak++;
          d.setDate(d.getDate() - 1);
        } else {
          // check yesterday
          d.setDate(d.getDate() - 1);
        }

        while (true) {
          const checkKey = d.toISOString().split('T')[0];
          if (history[checkKey] === 100) {
            streak++;
            d.setDate(d.getDate() - 1);
          } else {
            break;
          }
        }
        return streak;
      };

      const completedCount = habits.filter(h => h.completed).length;
      const progressPct = habits.length > 0 ? Math.round((completedCount / habits.length) * 100) : 0;
      const currentStreak = calculateStreak();

      // Update history when progress changes
      useEffect(() => {
        setHistory(prev => ({
          ...prev,
          [todayKey]: progressPct
        }));
      }, [progressPct]);

      // --- REAL-TIME CLOUD DATABASE SYNC ENGINE ---
      useEffect(() => {
        if (!room.joined || !room.name || !room.pass || !db) {
          setSyncStatus('Local Only');
          return;
        }

        const roomHash = btoa(room.name.toLowerCase().trim() + '___' + room.pass.trim()).replace(/=/g, '');
        const roomRef = db.ref('rooms/' + roomHash);

        setSyncStatus('Connecting...');

        // 1. Sync User Data to Room
        const userPayload = {
          id: user.id,
          name: user.name || 'Anonymous Arc Member',
          avatar: user.avatar || '⚡',
          wakeTime: user.wakeTime || '',
          currentWeight: user.currentWeight || '',
          goalWeight: user.goalWeight || '',
          manifesto: user.manifesto || '',
          todayProgress: progressPct,
          completedCount: completedCount,
          totalHabits: habits.length,
          streak: currentStreak,
          lastUpdated: Date.now()
        };

        roomRef.child('members/' + user.id).set(userPayload);

        // 2. Realtime Listener for Room Members & Feed
        const listener = roomRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            // Members
            if (val.members) {
              const membersArray = Object.values(val.members);
              setRoomMembers(membersArray);
            } else {
              setRoomMembers([]);
            }

            // Activity Feed
            if (val.feed) {
              const feedArray = Object.values(val.feed).sort((a, b) => b.timestamp - a.timestamp);
              setActivityFeed(feedArray);
            } else {
              setActivityFeed([]);
            }
            setSyncStatus('Live Synced');
          } else {
            setRoomMembers([userPayload]);
            setActivityFeed([]);
            setSyncStatus('Live Synced');
          }
        }, (err) => {
          console.error("Sync Error:", err);
          setSyncStatus('Sync Error');
        });

        // Cleanup listener on unmount / room change
        return () => {
          roomRef.off('value', listener);
        };
      }, [room.joined, room.name, room.pass, user, progressPct, completedCount, habits.length, currentStreak]);

      // Handle Room Joining
      const handleJoinRoom = (e) => {
        e.preventDefault();
        if (!roomInputName.trim() || !roomInputPass.trim()) return;
        setRoom({
          name: roomInputName.trim(),
          pass: roomInputPass.trim(),
          joined: true
        });
      };

      const handleLeaveRoom = () => {
        setRoom({ name: '', pass: '', joined: false });
      };

      // Toggle Habit
      const toggleHabit = (id) => {
        setHabits(prev => prev.map(h => h.id === id ? { ...h, completed: !h.completed } : h));
      };

      // Add Custom Habit
      const handleAddHabit = (e) => {
        e.preventDefault();
        if (!newHabitText.trim()) return;
        setHabits(prev => [...prev, {
          id: 'h_' + Date.now(),
          text: newHabitText.trim(),
          completed: false
        }]);
        setNewHabitText('');
      };

      // Delete Habit
      const deleteHabit = (id) => {
        setHabits(prev => prev.filter(h => h.id !== id));
      };

      // Post Activity Feed Update
      const handlePostActivity = (e) => {
        e.preventDefault();
        if (!newPostText.trim() || !room.joined || !db) return;

        const roomHash = btoa(room.name.toLowerCase().trim() + '___' + room.pass.trim()).replace(/=/g, '');
        const postRef = db.ref('rooms/' + roomHash + '/feed').push();

        postRef.set({
          id: postRef.key,
          userId: user.id,
          userName: user.name || 'Anonymous',
          userAvatar: user.avatar || '⚡',
          content: newPostText.trim(),
          timestamp: Date.now()
        });

        setNewPostText('');
      };

      // Icons wrapper helper using Lucide
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          
          {/* TOP HEADER */}
          <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-arc-border mb-6">
            <div>
              <div className="flex items-center gap-3">
                <span className="text-3xl">❄️</span>
                <h1 className="text-2xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-cyan-300 to-indigo-400 uppercase">
                  WINTER ARC
                </h1>
                <span className="text-xs px-2.5 py-0.5 rounded-full bg-sky-950 text-sky-400 border border-sky-800/50 font-semibold">
                  OCT 1 - DEC 31
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-1">
                Zero Excuses. Pure Discipline. Social Accountability.
              </p>
            </div>

            {/* CLOUD SYNC BADGE */}
            <div className="flex items-center gap-3 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
              <div className="flex items-center gap-2">
                <span className={`w-2.5 h-2.5 rounded-full ${syncStatus === 'Live Synced' ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                <span className="text-xs font-mono text-slate-300">{syncStatus}</span>
              </div>
              {room.joined && (
                <div className="text-xs border-l border-slate-700 pl-3">
                  <span className="text-slate-400">Room: </span>
                  <span className="font-bold text-sky-400">{room.name}</span>
                </div>
              )}
            </div>
          </header>

          {/* SQUAD ROOM SETUP BANNER (IF NOT IN A ROOM) */}
          {!room.joined ? (
            <div className="mb-8 p-6 rounded-2xl bg-gradient-to-b from-slate-900 to-arc-card border border-sky-900/40 glow-box">
              <div className="max-w-lg mx-auto text-center">
                <h2 className="text-xl font-bold text-slate-100 mb-2">Join or Create a Private Squad Room</h2>
                <p className="text-sm text-slate-400 mb-6">
                  Enter a Room Name and Password. Friends typing the <span className="text-sky-400 font-semibold">exact same Room Name and Password</span> from anywhere in the world will join your live room!
                </p>

                <form onSubmit={handleJoinRoom} className="space-y-4 text-left">
                  <div>
                    <label htmlFor="room_name_input" className="block text-xs font-medium text-slate-300 mb-1">
                      Squad Room Name
                    </label>
                    <input
                      id="room_name_input"
                      type="text"
                      required
                      placeholder="e.g. AlphaSquad"
                      value={roomInputName}
                      onChange={(e) => setRoomInputName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div>
                    <label htmlFor="room_pass_input" className="block text-xs font-medium text-slate-300 mb-1">
                      Room Password
                    </label>
                    <input
                      id="room_pass_input"
                      type="password"
                      required
                      placeholder="Secret room password"
                      value={roomInputPass}
                      onChange={(e) => setRoomInputPass(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold rounded-xl transition duration-200 shadow-lg shadow-sky-500/20"
                  >
                    Enter Squad Room
                  </button>
                </form>
              </div>
            </div>
          ) : null}

          {/* USER QUICK SUMMARY STATS */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div className="bg-arc-card p-4 rounded-xl border border-arc-border">
              <span className="text-xs text-slate-400 font-medium block">Today's Progress</span>
              <div className="flex items-baseline gap-1 mt-1">
                <span className="text-2xl font-black text-sky-400">{progressPct}%</span>
                <span className="text-xs text-slate-500">({completedCount}/{habits.length})</span>
              </div>
            </div>

            <div className="bg-arc-card p-4 rounded-xl border border-arc-border">
              <span className="text-xs text-slate-400 font-medium block">Current Streak</span>
              <div className="flex items-baseline gap-1 mt-1">
                <span className="text-2xl font-black text-amber-400">{currentStreak}</span>
                <span className="text-xs text-slate-500">days</span>
              </div>
            </div>

            <div className="bg-arc-card p-4 rounded-xl border border-arc-border">
              <span className="text-xs text-slate-400 font-medium block">Current Weight</span>
              <div className="flex items-baseline gap-1 mt-1">
                <span className="text-2xl font-black text-indigo-400">
                  {user.currentWeight ? user.currentWeight : '--'}
                </span>
                <span className="text-xs text-slate-500">kg</span>
              </div>
            </div>

            <div className="bg-arc-card p-4 rounded-xl border border-arc-border">
              <span className="text-xs text-slate-400 font-medium block">Squad Members</span>
              <div className="flex items-baseline gap-1 mt-1">
                <span className="text-2xl font-black text-emerald-400">
                  {roomMembers.length > 0 ? roomMembers.length : 1}
                </span>
                <span className="text-xs text-slate-500">online</span>
              </div>
            </div>
          </div>

          {/* NAVIGATION TABS */}
          <div className="flex border-b border-arc-border mb-6">
            <button
              onClick={() => setActiveTab('habits')}
              className={`px-5 py-3 font-semibold text-sm transition border-b-2 flex items-center gap-2 ${
                activeTab === 'habits'
                  ? 'border-sky-400 text-sky-400'
                  : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <span>Daily Rules</span>
            </button>

            <button
              onClick={() => setActiveTab('leaderboard')}
              className={`px-5 py-3 font-semibold text-sm transition border-b-2 flex items-center gap-2 ${
                activeTab === 'leaderboard'
                  ? 'border-sky-400 text-sky-400'
                  : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <span>Squad Leaderboard</span>
            </button>

            <button
              onClick={() => setActiveTab('feed')}
              className={`px-5 py-3 font-semibold text-sm transition border-b-2 flex items-center gap-2 ${
                activeTab === 'feed'
                  ? 'border-sky-400 text-sky-400'
                  : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <span>Activity Feed</span>
            </button>

            <button
              onClick={() => setActiveTab('profile')}
              className={`px-5 py-3 font-semibold text-sm transition border-b-2 flex items-center gap-2 ${
                activeTab === 'profile'
                  ? 'border-sky-400 text-sky-400'
                  : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <span>Profile Settings</span>
            </button>
          </div>

          {/* TAB 1: DAILY HABITS */}
          {activeTab === 'habits' && (
            <div className="space-y-6">
              <div className="bg-arc-card p-6 rounded-2xl border border-arc-border">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-lg font-bold text-slate-100">Today's Discipline Checklist</h2>
                  <span className="text-xs text-slate-400">{todayKey}</span>
                </div>

                {/* Progress Bar */}
                <div className="w-full bg-slate-900 h-3 rounded-full overflow-hidden mb-6 border border-slate-800">
                  <div
                    className="bg-gradient-to-r from-sky-500 to-indigo-500 h-full transition-all duration-300"
                    style={{ width: `${progressPct}%` }}
                  ></div>
                </div>

                {/* Habit List */}
                <div className="space-y-3">
                  {habits.map((habit) => (
                    <div
                      key={habit.id}
                      onClick={() => toggleHabit(habit.id)}
                      className={`flex items-center justify-between p-4 rounded-xl border cursor-pointer transition ${
                        habit.completed
                          ? 'bg-sky-950/30 border-sky-800/60 text-slate-200'
                          : 'bg-slate-900/50 border-slate-800 text-slate-400 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <div
                          className={`w-6 h-6 rounded-lg flex items-center justify-center border ${
                            habit.completed
                              ? 'bg-sky-500 border-sky-400 text-slate-950 font-bold'
                              : 'border-slate-700'
                          }`}
                        >
                          {habit.completed ? '✓' : ''}
                        </div>
                        <span className={`text-sm font-medium ${habit.completed ? 'line-through text-slate-300' : ''}`}>
                          {habit.text}
                        </span>
                      </div>

                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          deleteHabit(habit.id);
                        }}
                        className="text-xs text-slate-500 hover:text-red-400 px-2 py-1"
                      >
                        Delete
                      </button>
                    </div>
                  ))}
                </div>

                {/* Add Custom Habit Form */}
                <form onSubmit={handleAddHabit} className="mt-6 flex gap-2">
                  <input
                    type="text"
                    placeholder="Add custom rule (e.g., Cold Shower 3 mins)..."
                    value={newHabitText}
                    onChange={(e) => setNewHabitText(e.target.value)}
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-sky-500"
                  />
                  <button
                    type="submit"
                    className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 font-semibold text-sm rounded-xl transition"
                  >
                    Add Rule
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* TAB 2: SQUAD LEADERBOARD */}
          {activeTab === 'leaderboard' && (
            <div className="space-y-6">
              {!room.joined ? (
                <div className="p-8 text-center bg-arc-card rounded-2xl border border-arc-border">
                  <p className="text-slate-400 mb-4">You are not currently in a room.</p>
                  <button
                    onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                    className="px-6 py-2.5 bg-sky-500 text-white font-bold rounded-xl"
                  >
                    Join / Create Room Above
                  </button>
                </div>
              ) : (
                <>
                  <div className="bg-arc-card p-6 rounded-2xl border border-arc-border">
                    <div className="flex items-center justify-between mb-6">
                      <div>
                        <h2 className="text-lg font-bold text-slate-100">
                          Squad Leaderboard — <span className="text-sky-400">{room.name}</span>
                        </h2>
                        <p className="text-xs text-slate-400">Ranked by today's discipline completion rate</p>
                      </div>
                      <button
                        onClick={handleLeaveRoom}
                        className="text-xs text-red-400 border border-red-900/40 bg-red-950/20 px-3 py-1.5 rounded-lg hover:bg-red-900/30"
                      >
                        Change Room
                      </button>
                    </div>

                    <div className="space-y-3">
                      {roomMembers.length === 0 ? (
                        <p className="text-slate-500 text-sm text-center py-6">Waiting for room members to load...</p>
                      ) : (
                        [...roomMembers]
                          .sort((a, b) => (b.todayProgress || 0) - (a.todayProgress || 0))
                          .map((member, idx) => (
                            <div
                              key={member.id || idx}
                              className={`p-4 rounded-xl border flex items-center justify-between ${
                                member.id === user.id
                                  ? 'bg-sky-950/20 border-sky-500/50'
                                  : 'bg-slate-900/50 border-slate-800'
                              }`}
                            >
                              <div className="flex items-center gap-4">
                                <span className={`font-black text-lg w-6 ${
                                  idx === 0 ? 'text-amber-400' : idx === 1 ? 'text-slate-300' : idx === 2 ? 'text-amber-700' : 'text-slate-600'
                                }`}>
                                  #{idx + 1}
                                </span>
                                <div className="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xl">
                                  {member.avatar || '⚡'}
                                </div>
                                <div>
                                  <div className="flex items-center gap-2">
                                    <span className="font-bold text-sm text-slate-100">
                                      {member.name || 'Anonymous'}
                                    </span>
                                    {member.id === user.id && (
                                      <span className="text-[10px] bg-sky-950 text-sky-400 px-2 py-0.5 rounded border border-sky-800">
                                        YOU
                                      </span>
                                    )}
                                  </div>
                                  <p className="text-xs text-slate-400">
                                    Streak: <span className="text-amber-400 font-semibold">{member.streak || 0}d</span>
                                    {member.currentWeight ? ` • ${member.currentWeight}kg` : ''}
                                  </p>
                                </div>
                              </div>

                              <div className="text-right">
                                <span className="text-lg font-black text-sky-400">{member.todayProgress || 0}%</span>
                                <p className="text-xs text-slate-500">
                                  {member.completedCount || 0}/{member.totalHabits || 0} rules
                                </p>
                              </div>
                            </div>
                          ))
                      )}
                    </div>
                  </div>

                  {/* GLORY & SHAME ACCOUNTABILITY BOARD */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="bg-emerald-950/20 border border-emerald-800/40 p-5 rounded-2xl">
                      <h3 className="text-emerald-400 font-bold text-sm mb-3 flex items-center gap-2">
                        <span>👑</span> Glory Board (100% Completed)
                      </h3>
                      <div className="space-y-2">
                        {roomMembers.filter(m => m.todayProgress === 100).length === 0 ? (
                          <p className="text-xs text-slate-500 italic">No one hit 100% today yet.</p>
                        ) : (
                          roomMembers.filter(m => m.todayProgress === 100).map(m => (
                            <div key={m.id} className="text-xs font-semibold text-emerald-200 bg-emerald-900/30 px-3 py-2 rounded-lg">
                              {m.avatar} {m.name} — Locked In!
                            </div>
                          ))
                        )}
                      </div>
                    </div>

                    <div className="bg-rose-950/20 border border-rose-800/40 p-5 rounded-2xl">
                      <h3 className="text-rose-400 font-bold text-sm mb-3 flex items-center gap-2">
                        <span>⚠️</span> Accountability Zone (&lt;50% Completed)
                      </h3>
                      <div className="space-y-2">
                        {roomMembers.filter(m => (m.todayProgress || 0) < 50).length === 0 ? (
                          <p className="text-xs text-slate-500 italic">Everyone is on track!</p>
                        ) : (
                          roomMembers.filter(m => (m.todayProgress || 0) < 50).map(m => (
                            <div key={m.id} className="text-xs font-semibold text-rose-300 bg-rose-900/30 px-3 py-2 rounded-lg">
                              {m.avatar} {m.name} — Currently at {m.todayProgress || 0}%
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>
                </>
              )}
            </div>
          )}

          {/* TAB 3: ACTIVITY FEED */}
          {activeTab === 'feed' && (
            <div className="space-y-6">
              {!room.joined ? (
                <div className="p-8 text-center bg-arc-card rounded-2xl border border-arc-border">
                  <p className="text-slate-400 mb-4">Join a squad room to interact in the live activity feed.</p>
                </div>
              ) : (
                <div className="bg-arc-card p-6 rounded-2xl border border-arc-border">
                  <h2 className="text-lg font-bold text-slate-100 mb-4">Squad Activity Feed</h2>

                  {/* Post Box */}
                  <form onSubmit={handlePostActivity} className="mb-6 space-y-3">
                    <textarea
                      rows="2"
                      placeholder="Post a update (e.g. Just finished 5 AM run in the cold)..."
                      value={newPostText}
                      onChange={(e) => setNewPostText(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-sky-500 custom-scrollbar resize-none"
                    ></textarea>
                    <div className="flex justify-end">
                      <button
                        type="submit"
                        className="px-5 py-2 bg-sky-500 hover:bg-sky-400 text-white font-bold text-xs rounded-xl shadow"
                      >
                        Broadcast Update
                      </button>
                    </div>
                  </form>

                  {/* Feed Items */}
                  <div className="space-y-4">
                    {activityFeed.length === 0 ? (
                      <p className="text-slate-500 text-sm text-center py-6">No updates posted yet. Be the first!</p>
                    ) : (
                      activityFeed.map((post) => (
                        <div key={post.id} className="p-4 rounded-xl bg-slate-900/60 border border-slate-800/80">
                          <div className="flex items-center justify-between mb-2">
                            <div className="flex items-center gap-2">
                              <span className="text-lg">{post.userAvatar || '⚡'}</span>
                              <span className="font-bold text-sm text-slate-200">{post.userName}</span>
                            </div>
                            <span className="text-[10px] text-slate-500">
                              {new Date(post.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                            </span>
                          </div>
                          <p className="text-sm text-slate-300">{post.content}</p>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 4: PROFILE SETTINGS */}
          {activeTab === 'profile' && (
            <div className="bg-arc-card p-6 rounded-2xl border border-arc-border max-w-xl mx-auto space-y-4">
              <h2 className="text-lg font-bold text-slate-100 mb-4">Customize Profile</h2>

              <div>
                <label htmlFor="user_name_input" className="block text-xs font-medium text-slate-300 mb-1">
                  Your Name
                </label>
                <input
                  id="user_name_input"
                  type="text"
                  value={user.name}
                  onChange={(e) => setUser({ ...user, name: e.target.value })}
                  placeholder="e.g. Alex"
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-sky-500"
                />
              </div>

              <div>
                <label htmlFor="user_avatar_input" className="block text-xs font-medium text-slate-300 mb-1">
                  Avatar Emoji
                </label>
                <input
                  id="user_avatar_input"
                  type="text"
                  value={user.avatar}
                  onChange={(e) => setUser({ ...user, avatar: e.target.value })}
                  placeholder="e.g. ⚡"
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-sky-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label htmlFor="user_weight_input" className="block text-xs font-medium text-slate-300 mb-1">
                    Current Weight (kg)
                  </label>
                  <input
                    id="user_weight_input"
                    type="number"
                    value={user.currentWeight}
                    onChange={(e) => setUser({ ...user, currentWeight: e.target.value })}
                    placeholder="e.g. 75"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-sky-500"
                  />
                </div>

                <div>
                  <label htmlFor="user_goal_weight_input" className="block text-xs font-medium text-slate-300 mb-1">
                    Goal Weight (kg)
                  </label>
                  <input
                    id="user_goal_weight_input"
                    type="number"
                    value={user.goalWeight}
                    onChange={(e) => setUser({ ...user, goalWeight: e.target.value })}
                    placeholder="e.g. 70"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-sky-500"
                  />
                </div>
              </div>

              <div>
                <label htmlFor="user_manifesto_input" className="block text-xs font-medium text-slate-300 mb-1">
                  Winter Arc Manifesto / Main Goal
                </label>
                <textarea
                  id="user_manifesto_input"
                  rows="3"
                  value={user.manifesto}
                  onChange={(e) => setUser({ ...user, manifesto: e.target.value })}
                  placeholder="Why are you taking on the Winter Arc?"
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-sky-500 custom-scrollbar resize-none"
                ></textarea>
              </div>

              <p className="text-xs text-emerald-400 font-medium pt-2">
                ✓ Profile changes save automatically and sync to your room.
              </p>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
